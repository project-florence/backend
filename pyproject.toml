[tool.ruff]
line-length = 100
target-version = "py312"

exclude = [
    "migrations",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
# Varsayilan `pytest` kosusu entegrasyon katmanini calistirmaz (hermetik,
# ag/DB istemez kalir). Acikca calistirmak icin: `pytest -m integration`
# (komut satirindaki -m, addopts'takini gecersiz kilar). Bkz.
# tests/test_llm_integration.py docstring'i -- REFACTOR_PLAN.md Adim 6.
addopts = "-m 'not integration'"
markers = [
    "integration: gercek Postgres/Redis'e karsi calisan, opt-in entegrasyon testleri; container yoksa temiz sekilde skip edilir (tests/test_llm_integration.py).",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0
