name: deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/florence
            git pull --ff-only
            # Export dosya dizini: container user'i (10001) yazabilmeli (mount icin)
            mkdir -p data/exports
            chown 10001:10001 data/exports
            chmod 775 data/exports
            docker-compose down
            docker-compose up -d --build
