name: tag-from-version

# Versiyon text'i tek kaynak: src/version.py'deki VERSION degisince
# (main'e push), v${VERSION} tag'i otomatik atilir (varsa atlanir).
# Tag atilinca deploy workflow'u (tag tetiklemeli) otomatik calisir.
#
# Kullanim: version.py'de VERSION = "0.4.0" yap -> push -> tag + deploy otomatik.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag from version text
        env:
          SYNC_TOKEN: ${{ secrets.DESKTOP_SYNC_TOKEN }}
        run: |
          set -e
          VER=$(grep -oP 'VERSION = "\K[^"]+' src/version.py)
          TAG="v${VER}"
          echo "version text: ${VER} -> tag: ${TAG}"
          # PAT ile push: GITHUB_TOKEN ile yapilan push'lar baska workflow'lari
          # tetiklemez (deploy tetiklenmez); PAT ile tetiklenir.
          git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/project-florence/backend.git"
          # annotated tag icin git kimligi gerekir
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} zaten var, atlaniyor (deploy tetiklenmez)"
          else
            git tag -a "${TAG}" -m "release ${TAG} (otomatik, version text'inden)"
            git push origin "${TAG}"
            echo "Tag ${TAG} atildi -> deploy otomatik tetiklendi"
          fi
