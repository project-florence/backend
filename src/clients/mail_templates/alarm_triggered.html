<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Fiyat Alarmı — Florence</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;">
          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 16px;font-size:22px;color:#0f172a;">Fiyat Alarmı Tetiklendi</h1>
              <p style="margin:0 0 12px;font-size:15px;color:#334155;line-height:1.6;">Merhaba,</p>
              <p style="margin:0 0 12px;font-size:15px;color:#334155;line-height:1.6;">
                <strong>%TICKER%</strong> için belirlediğin alarm tetiklendi:
              </p>
              <table role="presentation" width="100%" cellpadding="8" cellspacing="0" style="margin:0 0 20px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;">
                <tr>
                  <td style="font-size:14px;color:#475569;">Hedef fiyat</td>
                  <td style="font-size:14px;color:#0f172a;font-weight:bold;text-align:right;">%TARGET%</td>
                </tr>
                <tr>
                  <td style="font-size:14px;color:#475569;">Güncel fiyat</td>
                  <td style="font-size:14px;color:#0f172a;font-weight:bold;text-align:right;">%PRICE%</td>
                </tr>
                <tr>
                  <td style="font-size:14px;color:#475569;">Zaman</td>
                  <td style="font-size:14px;color:#0f172a;font-weight:bold;text-align:right;">%TIME%</td>
                </tr>
              </table>
              <p style="margin:0;font-size:13px;color:#94a3b8;line-height:1.6;">
                Bu e-posta Florence uygulaması tarafından otomatik gönderilmiştir.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
