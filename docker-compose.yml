services:
  postgres:
    image: postgres:17
    container_name: florence_postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    container_name: florence_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT}:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "127.0.0.1:${SEARXNG_HOST_PORT}:8080"
    volumes:
      - searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY}
    restart: unless-stopped

  api:
    build: .
    container_name: florence_api
    user: "10001:10001"
    ports:
      - "127.0.0.1:${API_HOST_PORT}:7055"
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEWS_SEARCH_URL=http://searxng:8080/search
      - GOOGLE_APPLICATION_CREDENTIALS=/gcp-key.json
    volumes:
      - /var/log/florence:/var/log/florence
      - "${GOOGLE_APPLICATION_CREDENTIALS}:/gcp-key.json:ro"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  admin:
    build: .
    container_name: florence_admin
    # The admin UDS is mounted under /run/florence with host-managed permissions.
    user: "0:0"
    command: sh -c "umask 006 && exec uvicorn src.admin:admin_app --uds /run/florence/admin.sock"
    volumes:
      - /run/florence:/run/florence
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEWS_SEARCH_URL=http://searxng:8080/search
      - GOOGLE_APPLICATION_CREDENTIALS=/gcp-key.json
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  searxng:
