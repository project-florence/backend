# Tum servislerde log rotasyonu: sinirsiz json-file buyumesi 2026-09-15'te
# florence_api'de 227MB'a ulasti. 3x50MB tutulur, eskiler silinir.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:17
    container_name: florence_postgres
    logging: *default-logging
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    container_name: florence_redis
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT}:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    logging: *default-logging
    ports:
      - "127.0.0.1:${SEARXNG_HOST_PORT}:8080"
    volumes:
      - searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY}
    restart: unless-stopped

  api:
    build: .
    container_name: florence_api
    logging: *default-logging
    user: "10001:10001"
    ports:
      - "127.0.0.1:${API_HOST_PORT}:7055"
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEWS_SEARCH_URL=http://searxng:8080/search
      - GOOGLE_APPLICATION_CREDENTIALS=/gcp-key.json
    volumes:
      - /var/log/florence:/var/log/florence
      - ./data/exports:/app/data/exports
      - "${GOOGLE_APPLICATION_CREDENTIALS}:/gcp-key.json:ro"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  admin:
    build: .
    container_name: florence_admin
    logging: *default-logging
    # The admin UDS is mounted under /run/florence with host-managed permissions.
    user: "0:0"
    command: sh -c "umask 006 && exec uvicorn src.admin:admin_app --uds /run/florence/admin.sock"
    volumes:
      - /run/florence:/run/florence
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEWS_SEARCH_URL=http://searxng:8080/search
      - GOOGLE_APPLICATION_CREDENTIALS=/gcp-key.json
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Dev e-posta yakalayici (yalnizca --profile dev ile baslar):
  #   docker compose --profile dev up -d mailpit  ->  UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: florence_mailpit
    logging: *default-logging
    profiles: ["dev"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  searxng:
