services:
  postgres:
    image: postgres:latest
    container_name: florence_postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: florence_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT}:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "127.0.0.1:${SEARXNG_HOST_PORT}:8080"
    volumes:
      - searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY}
    restart: unless-stopped

  api:
    build: .
    container_name: florence_api
    ports:
      - "127.0.0.1:${API_HOST_PORT}:7055"
    env_file: .env
    volumes:
      - "${GOOGLE_APPLICATION_CREDENTIALS}:/gcp-key.json:ro"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  admin:
    build: .
    container_name: florence_admin
    command: uvicorn src.admin:admin_app --uds /run/florence/admin.sock --chmod-socket 660
    volumes:
      - /run/florence:/run/florence
    env_file: .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  searxng: